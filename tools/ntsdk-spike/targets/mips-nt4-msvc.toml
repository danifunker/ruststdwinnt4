[target]
family = "windows"
os-name = "windows"
env-name = "msvc"

[backend.c]
variant = "msvc"
target = "cl"
emulate-i128 = true

[arch]
name = "mips"
pointer-bits = 32
is-big-endian = false
has-atomic-u8 = true
has-atomic-u16 = true
has-atomic-u32 = true
has-atomic-u64 = false
has-atomic-ptr = true

[arch.alignments]
u16 = 2
u32 = 4
u64 = 8
u128 = 8
f32 = 4
f64 = 8
ptr = 4
