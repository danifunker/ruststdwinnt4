# The ntsdk spike (PLAN-mips-alpha-ppc.md): Visual C++ 4.1 for MIPS, Alpha and PowerPC from
# the tenox7/ntsdk image, pulled at run time (none of Microsoft's files are in this repository).
name: ntsdk spike

on:
  push:
    branches: [ntsdk-spike, alpha]
  workflow_dispatch:

env:
  MRUSTC_REPO: danifunker/mrustc
  MRUSTC_REF: eb5df108a30cd33210e1ef2fd0b68e2dd143f65e

jobs:
  # Step 1: hello.c built and run with ntrun on each CPU; then the one-feature probes.
  ntsdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker pull tenox7/ntsdk
      - name: hello.c on MIPS, Alpha and PowerPC
        run: |
          docker run --rm -v "$PWD":/src tenox7/ntsdk sh -c '
            cd tools/ntsdk-spike && rc=0
            for c in mips alpha ppc; do
              if ntsdk nt40 $c cl -nologo -Fehello-$c.exe hello.c && ntsdk nt40 $c ntrun hello-$c.exe a b; then
                echo "$c: pass"
              else
                echo "$c: FAIL"; rc=1
              fi
            done
            exit $rc'
      - name: NaN on Alpha, by compiler flag
        if: always()
        run: |
          docker run --rm -v "$PWD":/src tenox7/ntsdk sh -c '
            cd tools/ntsdk-spike/probes
            for f in "" -QAieee -QAieee1 -QAieee2 -QAieee3 -QAieee0; do
              echo "== cl $f"
              ntsdk nt40 alpha cl -nologo $f -Fenan.exe nan.c > cl.log 2>&1 || { head -3 cl.log; continue; }
              grep -i "warning\|ignor" cl.log | head -2
              ntsdk nt40 alpha ntrun nan.exe 2>&1 | tail -4
            done'
      - name: CreateThread on Alpha (for real machines)
        if: always()
        run: |
          docker run --rm -v "$PWD":/src tenox7/ntsdk sh -c '
            cd tools/ntsdk-spike/probes && ntsdk nt40 alpha cl -nologo -QAieee1 -Fethread-alpha.exe thread.c && ntsdk nt40 alpha cl -nologo -QAieee1 -Fethread2-alpha.exe thread2.c && ntsdk nt40 alpha cl -nologo -QAieee1 -Fethread3-alpha.exe thread3.c && ntsdk nt40 alpha cl -nologo -QAieee1 -Fethread5-alpha.exe thread5.c && ntsdk nt40 alpha ntrun thread-alpha.exe && ntsdk nt40 alpha ntrun thread2-alpha.exe'
      - name: Probes
        if: always()
        run: docker run --rm -v "$PWD":/src tenox7/ntsdk tools/ntsdk-spike/probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probes
          path: |
            tools/ntsdk-spike/probe-out
            tools/ntsdk-spike/probes/*.exe

  # mrustc's C for core, alloc, nt4rt and hello (MIPS and Alpha share it; PowerPC has its own).
  # The spike's measurements of mrustc's unchanged C: run by hand only.
  mrustc-c:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MRUSTC_REPO }}
          ref: ${{ env.MRUSTC_REF }}
          path: mrustc
      - uses: actions/cache@v4
        id: cache
        with:
          path: mrustc/bin/mrustc
          key: mrustc-${{ env.MRUSTC_REF }}-ubuntu-24.04
      - name: Build mrustc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          make -C mrustc -j"$(nproc)" bin/mrustc
      - name: Rust 1.90's library sources
        run: rustup toolchain install 1.90.0 --profile minimal --component rust-src
      - name: Translate
        run: |
          export LIBRARY="$(rustc +1.90.0 --print sysroot)/lib/rustlib/src/rust/library"
          for t in mips-nt4-msvc powerpc-nt4-msvc; do
            tools/ntsdk-spike/mrustc-c.sh $t "$PWD/mrustc/bin/mrustc"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mrustc-c
          path: out-*/*.c

  # Step 2: that C through cl, per CPU. hello first (smallest), core last (30 MB).
  compile:
    needs: mrustc-c
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cpu: [mips, alpha, ppc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mrustc-c
      - run: docker pull tenox7/ntsdk
      - name: cl on mrustc's C
        run: |
          case ${{ matrix.cpu }} in ppc) d=out-powerpc-nt4-msvc ;; *) d=out-mips-nt4-msvc ;; esac
          docker run --rm -v "$PWD":/src tenox7/ntsdk tools/ntsdk-spike/compile-c.sh ${{ matrix.cpu }} \
            $d/hello.exe.c $d/libnt4rt.rlib.c $d/liballoc.rlib.c $d/libcore.rlib.c | tee summary.txt
      # The same after c89filter.pl takes out the blockers the probes found: what cl says next.
      - name: cl on mrustc's C, filtered
        run: |
          case ${{ matrix.cpu }} in ppc) d=out-powerpc-nt4-msvc ;; *) d=out-mips-nt4-msvc ;; esac
          for f in hello.exe libnt4rt.rlib liballoc.rlib libcore.rlib; do
            perl tools/ntsdk-spike/c89filter.pl < $d/$f.c > $d/$f.c89.c
          done
          docker run --rm -v "$PWD":/src tenox7/ntsdk tools/ntsdk-spike/compile-c.sh ${{ matrix.cpu }} \
            $d/hello.exe.c89.c $d/libnt4rt.rlib.c89.c $d/liballoc.rlib.c89.c $d/libcore.rlib.c89.c | tee summary-c89.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cl-${{ matrix.cpu }}
          path: |
            summary*.txt
            out-*/*.log

  # Alpha: examples/hello through mrustc (with tools/mrustc-nt4/mrustc.patch, its C89 mode) and
  # Visual C++ 4.1, linked and run with ntrun.
  alpha-hello:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MRUSTC_REPO }}
          ref: ${{ env.MRUSTC_REF }}
          path: mrustc
      - run: git -C mrustc apply "$PWD/tools/mrustc-nt4/mrustc.patch"
      - uses: actions/cache@v4
        id: cache
        with:
          path: mrustc/bin/mrustc
          key: mrustc-${{ env.MRUSTC_REF }}-${{ hashFiles('tools/mrustc-nt4/mrustc.patch') }}-ubuntu-24.04
      - name: Build mrustc
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          make -C mrustc -j"$(nproc)" bin/mrustc
      - name: Rust 1.90's library sources
        run: rustup toolchain install 1.90.0 --profile minimal --component rust-src
      - name: Translate (mrustc)
        run: |
          export LIBRARY="$(rustc +1.90.0 --print sysroot)/lib/rustlib/src/rust/library"
          tools/mrustc-nt4/translate.sh alpha-nt4 out-alpha "$PWD/mrustc/bin/mrustc"
      - run: docker pull tenox7/ntsdk
      - name: Compile, link and run (Visual C++ 4.1, ntrun)
        run: docker run --rm -v "$PWD":/src tenox7/ntsdk tools/mrustc-nt4/build.sh alpha out-alpha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-hello
          path: |
            out-alpha/*.log
            out-alpha/*.exe

  # Alpha: std (std/1.90.0/nt4.patch, then tools/mrustc-nt4/std-edits.py) and examples/stdtest
  # through mrustc (minicargo for std's crates) and Visual C++ 4.1, run with ntrun.
  alpha-stdtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MRUSTC_REPO }}
          ref: ${{ env.MRUSTC_REF }}
          path: mrustc
      - run: git -C mrustc apply "$PWD/tools/mrustc-nt4/mrustc.patch"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            mrustc/bin/mrustc
            mrustc/bin/minicargo
          key: mrustc-minicargo-${{ env.MRUSTC_REF }}-${{ hashFiles('tools/mrustc-nt4/mrustc.patch') }}-ubuntu-24.04
      - name: Build mrustc and minicargo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          make -C mrustc -j"$(nproc)" bin/mrustc
          make -C mrustc/tools/minicargo -j"$(nproc)"
      - name: Rust 1.90's library sources
        run: rustup toolchain install 1.90.0 --profile minimal --component rust-src
      - name: std's source (patched, vendored)
        run: |
          export LIBRARY="$(rustc +1.90.0 --print sysroot)/lib/rustlib/src/rust/library"
          export PATH="$(rustc +1.90.0 --print sysroot)/bin:$PATH"
          tools/mrustc-nt4/mkstd.sh "$PWD/std-src"
      - name: Translate std and stdtest (mrustc)
        run: tools/mrustc-nt4/translate-std.sh alpha-nt4 "$PWD/std-src" out-std "$PWD/mrustc/bin/mrustc"
      - run: docker pull tenox7/ntsdk
      - name: Compile, link and run (Visual C++ 4.1, ntrun)
        run: docker run --rm -v "$PWD":/src tenox7/ntsdk tools/mrustc-nt4/build-std.sh alpha out-std
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-stdtest
          path: |
            out-std/*.log
            out-std/*.exe
            out-std/*.map
            out-std/*-alpha.obj
